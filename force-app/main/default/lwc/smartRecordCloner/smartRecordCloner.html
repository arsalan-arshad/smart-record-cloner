<template>
    <div class="cloner-container slds-card slds-p-around_medium">
        <!-- LOADING SPINNER -->
        <template if:true={isLoading}>
            <div class="slds-is-relative slds-p-vertical_xx-large loading-box">
                <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
                <p class="slds-text-align_center slds-text-heading_small slds-m-top_large loading-text">
                    {loadingMessage}
                </p>
            </div>
        </template>

        <!-- CONFIGURATION / FORM VIEW -->
        <template if:true={isConfigView}>
            <!-- HEADER -->
            <div class="slds-media slds-media_center slds-m-bottom_medium header-banner">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="standard:record_create" size="medium" alternative-text="Cloner"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-text-heading_medium slds-truncate font-bold">
                        Smart Record Cloner
                    </h2>
                    <p class="slds-text-body_small slds-text-color_weak">
                        Deep clone <strong>{config.recordName}</strong> ({config.sObjectLabel}) with selected related child records.
                    </p>
                </div>
            </div>

            <!-- ERROR NOTIFICATION -->
            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_small" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <h2>{errorMessage}</h2>
                </div>
            </template>

            <!-- FORM BODY -->
            <div class="slds-form slds-form_stacked slds-m-bottom_medium">
                <!-- NEW RECORD NAME INPUT -->
                <div class="slds-form-element slds-m-bottom_small">
                    <template if:true={config.isNameEditable}>
                        <lightning-input
                            type="text"
                            label="New Record Name"
                            value={newRecordName}
                            onchange={handleNameChange}
                            required
                            field-level-help="Specify the name for the newly cloned record.">
                        </lightning-input>
                    </template>
                    <template if:false={config.isNameEditable}>
                        <label class="slds-form-element__label">Record Name</label>
                        <div class="slds-form-element__control">
                            <span class="slds-badge slds-theme_shade">Auto-generated by Salesforce upon save</span>
                        </div>
                    </template>
                </div>

                <!-- RELATIONSHIPS SELECTOR HEADER -->
                <div class="slds-section slds-is-open slds-m-top_small">
                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_x-small section-header">
                        <div class="slds-col">
                            <span class="slds-text-title_bold">Related Lists to Clone</span>
                            <span class="slds-badge slds-m-left_small slds-badge_lightest">
                                {selectedChildCount} of {totalAvailableRecords} related records selected
                            </span>
                        </div>
                        <div class="slds-col">
                            <lightning-button-group>
                                <lightning-button label="Select All" onclick={handleSelectAll}></lightning-button>
                                <lightning-button label="Deselect All" onclick={handleDeselectAll}></lightning-button>
                            </lightning-button-group>
                        </div>
                    </div>

                    <!-- SEARCH / FILTER RELATIONSHIPS -->
                    <template if:true={hasMultipleRelationships}>
                        <div class="slds-m-bottom_x-small">
                            <lightning-input
                                type="search"
                                placeholder="Filter related lists..."
                                variant="label-hidden"
                                value={searchKeyword}
                                onchange={handleSearchChange}>
                            </lightning-input>
                        </div>
                    </template>

                    <!-- RELATIONSHIP LIST -->
                    <div class="relationships-container slds-scrollable_y">
                        <template if:true={filteredRelationships.length}>
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_compact" aria-label="Related Lists">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th class="col-checkbox" scope="col">
                                            <span class="slds-truncate">Include</span>
                                        </th>
                                        <th scope="col">
                                            <span class="slds-truncate">Related List</span>
                                        </th>
                                        <th scope="col">
                                            <span class="slds-truncate">Target Object</span>
                                        </th>
                                        <th class="col-count" scope="col">
                                            <span class="slds-truncate">Count</span>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={filteredRelationships} for:item="rel">
                                        <tr key={rel.relationshipName} class={rel.rowClass}>
                                            <td>
                                                <lightning-input
                                                    type="checkbox"
                                                    label="Include"
                                                    variant="label-hidden"
                                                    checked={rel.selected}
                                                    data-rel={rel.relationshipName}
                                                    onchange={handleCheckboxChange}>
                                                </lightning-input>
                                            </td>
                                            <td>
                                                <div class="slds-truncate font-medium">
                                                    {rel.childLabel}
                                                    <template if:true={rel.isCascadeDelete}>
                                                        <span class="slds-badge slds-m-left_xx-small master-badge" title="Master-Detail relationship">Master-Detail</span>
                                                    </template>
                                                </div>
                                            </td>
                                            <td>
                                                <span class="slds-text-body_small slds-text-color_weak font-mono">
                                                    {rel.childSObjectName}
                                                </span>
                                            </td>
                                            <td>
                                                <template if:true={rel.hasRecords}>
                                                    <span class="slds-badge slds-badge_inverse count-badge">
                                                        {rel.recordCount}
                                                    </span>
                                                </template>
                                                <template if:false={rel.hasRecords}>
                                                    <span class="slds-badge slds-theme_shade count-badge">
                                                        0
                                                    </span>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>

                        <!-- ZERO STATE IF NO MATCHES -->
                        <template if:false={filteredRelationships.length}>
                            <div class="slds-text-align_center slds-p-around_medium slds-text-color_weak">
                                No related lists matching "{searchKeyword}".
                            </div>
                        </template>
                    </div>
                </div>

                <!-- ADVANCED OPTIONS -->
                <div class="slds-m-top_medium advanced-box slds-p-around_small">
                    <lightning-input
                        type="checkbox"
                        label="Reset Status / Stage to Initial State"
                        checked={resetStatus}
                        onchange={handleResetStatusChange}
                        field-level-help="Resets Opportunity Stage to Prospecting, Case/Order/Quote to Draft or New, and adjusts expiration dates forward.">
                    </lightning-input>
                </div>
            </div>

            <!-- FOOTER ACTIONS -->
            <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    class="slds-m-right_small"
                    onclick={handleCancel}>
                </lightning-button>
                <lightning-button
                    label="Clone Record"
                    variant="brand"
                    icon-name="utility:copy"
                    onclick={handleClone}
                    disabled={isCloneDisabled}>
                </lightning-button>
            </div>
        </template>

        <!-- SUCCESS / CELEBRATION VIEW -->
        <template if:true={isSuccessView}>
            <div class="success-screen slds-p-around_medium slds-text-align_center">
                <!-- SUCCESS ICON -->
                <div class="slds-m-bottom_small success-icon-wrapper">
                    <lightning-icon icon-name="action:approval" size="large" alternative-text="Success"></lightning-icon>
                </div>

                <h2 class="slds-text-heading_large font-bold slds-text-color_success slds-m-bottom_x-small">
                    Record Cloned Successfully!
                </h2>
                <p class="slds-text-body_regular slds-m-bottom_medium">
                    New record <strong>"{cloneResult.newRecordName}"</strong> created with all selected related child records.
                </p>

                <!-- METRICS SUMMARY -->
                <div class="slds-grid slds-grid_align-center slds-wrap slds-m-bottom_medium metrics-container">
                    <div class="slds-box slds-box_x-small metric-card slds-m-horizontal_xx-small">
                        <span class="metric-number">1</span>
                        <span class="metric-label">Parent Record</span>
                    </div>
                    <div class="slds-box slds-box_x-small metric-card slds-m-horizontal_xx-small">
                        <span class="metric-number">{cloneResult.totalChildrenCloned}</span>
                        <span class="metric-label">Related Records</span>
                    </div>
                </div>

                <!-- BREAKDOWN LIST -->
                <template if:true={clonedBreakdown.length}>
                    <div class="breakdown-card slds-m-bottom_medium slds-p-around_small">
                        <div class="slds-text-title_bold slds-m-bottom_xx-small">Cloned Relationships Breakdown:</div>
                        <ul class="slds-list_dotted slds-text-align_left slds-m-left_large">
                            <template for:each={clonedBreakdown} for:item="item">
                                <li key={item.relName}>
                                    <strong>{item.count}</strong> {item.relName}
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>

                <!-- REVIEW HOOK CARD (As required by README & AppExchange strategy) -->
                <div class="review-hook-card slds-box slds-m-bottom_medium slds-theme_shade">
                    <div class="slds-grid slds-grid_vertical-align-center">
                        <div class="slds-col slds-size_1-of-12">
                            <span class="star-icon">⭐</span>
                        </div>
                        <div class="slds-col slds-size_11-of-12 slds-text-align_left">
                            <p class="font-bold review-title">Saved you 15 minutes?</p>
                            <p class="slds-text-body_small slds-text-color_weak">
                                Smart Record Cloner is 100% free and open-source. Help other Trailblazers discover it by leaving a 5-star review!
                            </p>
                            <div class="slds-m-top_xx-small">
                                <a href="https://appexchange.salesforce.com" target="_blank" class="review-link">
                                    Leave an AppExchange Review &rarr;
                                </a>
                                <span class="slds-m-horizontal_small slds-text-color_weak">•</span>
                                <a href="https://github.com" target="_blank" class="review-link">
                                    Star on GitHub &rarr;
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- POST-CLONE ACTIONS -->
                <div class="slds-grid slds-grid_align-center slds-m-top_medium">
                    <lightning-button
                        label="Close"
                        variant="neutral"
                        class="slds-m-right_small"
                        onclick={handleCloseModal}>
                    </lightning-button>
                    <lightning-button
                        label="View New Record"
                        variant="brand"
                        icon-name="utility:forward"
                        onclick={handleNavigateToNewRecord}>
                    </lightning-button>
                </div>
            </div>
        </template>
    </div>
</template>
